[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "integration: tests that require the local PostgreSQL and Redis services",
  "e2e: end-to-end full pilot user journey simulation tests",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "fastapi", "httpx", "pytest", "sqlalchemy"]
