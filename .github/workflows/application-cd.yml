name: Application CD

on:
  pull_request:
    paths:
      - 'infrastructure/docker/**'
      - '.github/scripts/**'
      - '.github/workflows/application-cd.yml'
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/docker/**'
      - '.github/scripts/**'
      - '.github/workflows/application-cd.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose images should be built
        required: true
        type: choice
        options:
          - staging
          - production
      deploy:
        description: Run migrations and deploy after building images
        required: true
        default: false
        type: boolean

env:
  AWS_REGION: eu-west-1

concurrency:
  group: application-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-definition:
    name: Validate deployment definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required deployment assets
        run: bash .github/scripts/validate-application-cd.sh

      - name: Build API image for hardened-runtime validation
        run: |
          docker build \
            --file infrastructure/docker/backend.Dockerfile \
            --tag "stem-cogent-api-validation:${GITHUB_SHA}" \
            backend

      - name: Verify writable temp space with a read-only root filesystem
        shell: bash
        run: |
          image="stem-cogent-api-validation:${GITHUB_SHA}"
          docker image inspect "$image" |
            jq -e '.[0].Config.Volumes | has("/tmp")' >/dev/null
          docker run --rm \
            --read-only \
            --entrypoint python \
            "$image" \
            -c 'import os, tempfile; fd, path = tempfile.mkstemp(prefix="wgunicorn-"); os.close(fd); os.unlink(path)'

      - name: Build frontend image for hardened-runtime validation
        run: |
          docker build \
            --file infrastructure/docker/frontend.Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api.validation.invalid \
            --build-arg NEXT_PUBLIC_WS_URL=wss://api.validation.invalid \
            --tag "stem-cogent-frontend-validation:${GITHUB_SHA}" \
            frontend

      - name: Verify frontend health with a read-only root filesystem
        shell: bash
        run: |
          image="stem-cogent-frontend-validation:${GITHUB_SHA}"
          docker image inspect "$image" |
            jq -e '.[0].Config.Volumes | has("/tmp") and has("/app/.next/cache")' >/dev/null
          docker image inspect "$image" |
            jq -e '.[0].Config.Healthcheck.Test == ["CMD", "node", "/app/healthcheck.mjs"]' >/dev/null

          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          container_id="$(docker run --detach --read-only --publish 127.0.0.1:3001:3000 "$image")"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/; then
              docker exec "$container_id" node /app/healthcheck.mjs
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_id" >&2
          exit 1

  deployment-disabled:
    name: Deployment intentionally disabled
    if: github.event_name == 'push' && ((github.ref_name == 'staging' && vars.STAGING_APPLICATION_DEPLOY_ENABLED != 'true') || (github.ref_name == 'main' && vars.PRODUCTION_APPLICATION_DEPLOY_ENABLED != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report inactive deployment gate
        run: echo "Application deployment remains disabled until its Phase 1 infrastructure prerequisites are complete."

  build-images:
    name: Build ${{ matrix.image }} image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && ((github.ref_name == 'staging' && vars.STAGING_APPLICATION_DEPLOY_ENABLED == 'true') || (github.ref_name == 'main' && vars.PRODUCTION_APPLICATION_DEPLOY_ENABLED == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infrastructure/docker/backend.Dockerfile
            context: backend
          - image: worker
            dockerfile: infrastructure/docker/worker.Dockerfile
            context: backend
          - image: frontend
            dockerfile: infrastructure/docker/frontend.Dockerfile
            context: frontend
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_APPLICATION_BUILD_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ matrix.image == 'api' && vars.ECR_API_REPOSITORY || matrix.image == 'worker' && vars.ECR_WORKER_REPOSITORY || vars.ECR_FRONTEND_REPOSITORY }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify build configuration
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            expected_ref="${{ inputs.environment == 'production' && 'main' || 'staging' }}"
            test "$GITHUB_REF_NAME" = "$expected_ref" || {
              echo "${{ inputs.environment }} builds must run from the $expected_ref branch." >&2
              exit 1
            }
          fi
          for variable in AWS_ROLE_ARN AWS_ACCOUNT_ID ECR_REPOSITORY; do
            test -n "${!variable}" || {
              echo "$variable is not configured in the GitHub deployment environment." >&2
              exit 1
            }
          done
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || {
            echo "AWS_ACCOUNT_ID must contain exactly 12 digits." >&2
            exit 1
          }
          if [ "${{ matrix.image }}" = "frontend" ]; then
            for variable in NEXT_PUBLIC_API_URL NEXT_PUBLIC_WS_URL; do
              test -n "${!variable}" || {
                echo "$variable is required to build the frontend image." >&2
                exit 1
              }
            done
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: sc-application-build-${{ matrix.image }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ECR repository
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null

      - name: Check for existing immutable image
        id: immutable-image
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing immutable image $ECR_REPOSITORY:$IMAGE_TAG."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Amazon ECR
        if: steps.immutable-image.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        if: steps.immutable-image.outputs.exists != 'true'
        shell: bash
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          build_args=()
          if [ "${{ matrix.image }}" = "frontend" ]; then
            build_args+=(
              --build-arg "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
              --build-arg "NEXT_PUBLIC_WS_URL=$NEXT_PUBLIC_WS_URL"
            )
          fi

          docker build --pull \
            -f "${{ matrix.dockerfile }}" \
            "${build_args[@]}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            "${{ matrix.context }}"

      - name: Verify migration runtime is packaged
        if: matrix.image == 'api' && steps.immutable-image.outputs.exists != 'true'
        shell: bash
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker run --rm --entrypoint alembic "$image" heads |
            grep -Eq '^[0-9]{4} \(head\)$'

      - name: Verify worker runtime and task registry are packaged
        if: matrix.image == 'worker' && steps.immutable-image.outputs.exists != 'true'
        shell: bash
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker run --rm --entrypoint python "$image" -c "from app.workers.celery_app import TASK_MODULES, celery_app; celery_app.loader.import_default_modules(); expected = {'app.workers.tasks.collection.collect_source', 'app.workers.tasks.validation.validate_raw_signal', 'app.workers.tasks.normalization.normalize_raw_signal', 'app.workers.tasks.classification.classify_signal', 'app.workers.tasks.scoring.score_signal', 'app.workers.tasks.embedding.embed_signal', 'app.workers.tasks.synthesis.synthesize_global_output', 'app.workers.tasks.decision.create_decision_briefs', 'app.workers.tasks.scheduler.schedule_due_sources'}; missing = expected.difference(celery_app.tasks); assert not missing, f'missing Celery tasks: {sorted(missing)}'; assert set(TASK_MODULES) == set(celery_app.conf.include)"

      - name: Push immutable commit tag
        if: steps.immutable-image.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  verify-role-boundaries:
    name: Verify Application CD OIDC role boundaries
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == false
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_BUILD_ROLE_ARN: ${{ vars.AWS_APPLICATION_BUILD_ROLE_ARN }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_APPLICATION_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}

    steps:
      - name: Verify boundary test configuration
        shell: bash
        run: |
          for variable in \
            AWS_BUILD_ROLE_ARN \
            AWS_DEPLOY_ROLE_ARN \
            AWS_ACCOUNT_ID \
            ECS_CLUSTER_NAME \
            ECR_API_REPOSITORY; do
            test -n "${!variable}" || {
              echo "$variable is not configured in the GitHub deployment environment." >&2
              exit 1
            }
          done

      - name: Assume build role through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_BUILD_ROLE_ARN }}
          role-session-name: sc-application-boundary-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm build role cannot access ECS
        shell: bash
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          set +e
          denial="$(aws ecs describe-clusters --clusters "$ECS_CLUSTER_NAME" 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0 || {
            echo "Build role unexpectedly accessed ECS." >&2
            exit 1
          }
          grep -Eiq 'AccessDenied|not authorized' <<<"$denial" || {
            echo "ECS probe failed for a reason other than least-privilege denial:" >&2
            echo "$denial" >&2
            exit 1
          }

      - name: Assume deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: sc-application-boundary-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm deploy role cannot access ECR
        shell: bash
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          set +e
          denial="$(aws ecr describe-repositories --repository-names "$ECR_API_REPOSITORY" 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0 || {
            echo "Deploy role unexpectedly accessed ECR." >&2
            exit 1
          }
          grep -Eiq 'AccessDenied|not authorized' <<<"$denial" || {
            echo "ECR probe failed for a reason other than least-privilege denial:" >&2
            echo "$denial" >&2
            exit 1
          }

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    if: (github.event_name == 'push' && ((github.ref_name == 'staging' && vars.STAGING_APPLICATION_DEPLOY_ENABLED == 'true') || (github.ref_name == 'main' && vars.PRODUCTION_APPLICATION_DEPLOY_ENABLED == 'true'))) || (github.event_name == 'workflow_dispatch' && inputs.deploy == true && ((inputs.environment == 'staging' && vars.STAGING_APPLICATION_DEPLOY_ENABLED == 'true') || (inputs.environment == 'production' && vars.PRODUCTION_APPLICATION_DEPLOY_ENABLED == 'true')))
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_APPLICATION_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
      ECR_WORKER_REPOSITORY: ${{ vars.ECR_WORKER_REPOSITORY }}
      ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_MIGRATION_TASK_DEFINITION: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
      ECS_MIGRATION_CONTAINER_NAME: ${{ vars.ECS_MIGRATION_CONTAINER_NAME }}
      ECS_MIGRATION_SUBNET_IDS: ${{ vars.ECS_MIGRATION_SUBNET_IDS }}
      ECS_MIGRATION_SECURITY_GROUP_IDS: ${{ vars.ECS_MIGRATION_SECURITY_GROUP_IDS }}
      ECS_SERVICE_DEPLOYMENTS: ${{ vars.ECS_SERVICE_DEPLOYMENTS }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      AUTH_SMOKE_TEST_PATH: ${{ vars.AUTH_SMOKE_TEST_PATH }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deployment configuration
        shell: bash
        run: |
          required_variables=(
            AWS_ROLE_ARN
            AWS_ACCOUNT_ID
            ECR_API_REPOSITORY
            ECR_WORKER_REPOSITORY
            ECR_FRONTEND_REPOSITORY
            ECS_CLUSTER_NAME
            ECS_MIGRATION_TASK_DEFINITION
            ECS_MIGRATION_CONTAINER_NAME
            ECS_MIGRATION_SUBNET_IDS
            ECS_MIGRATION_SECURITY_GROUP_IDS
            ECS_SERVICE_DEPLOYMENTS
            API_BASE_URL
          )
          for variable in "${required_variables[@]}"; do
            test -n "${!variable}" || {
              echo "$variable is not configured in the GitHub deployment environment." >&2
              exit 1
            }
          done
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || {
            echo "AWS_ACCOUNT_ID must contain exactly 12 digits." >&2
            exit 1
          }
          [[ "$API_BASE_URL" == https://* ]] || {
            echo "API_BASE_URL must use HTTPS." >&2
            exit 1
          }
          jq -e 'type == "array" and length > 0 and all(.[]; ((.service | type) == "string") and ((.service | length) > 0) and ((.container | type) == "string") and ((.container | length) > 0) and (.image == "api" or .image == "worker" or .image == "frontend"))' <<<"$ECS_SERVICE_DEPLOYMENTS" >/dev/null || {
            echo "ECS_SERVICE_DEPLOYMENTS must be a non-empty valid service deployment array." >&2
            exit 1
          }
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' \
            <<<"$ECS_MIGRATION_SUBNET_IDS" >/dev/null || {
            echo "ECS_MIGRATION_SUBNET_IDS must be a non-empty JSON string array." >&2
            exit 1
          }
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' \
            <<<"$ECS_MIGRATION_SECURITY_GROUP_IDS" >/dev/null || {
            echo "ECS_MIGRATION_SECURITY_GROUP_IDS must be a non-empty JSON string array." >&2
            exit 1
          }

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: sc-application-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS deployment target
        shell: bash
        run: |
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account_id" = "$AWS_ACCOUNT_ID" || {
            echo "OIDC role targets AWS account $actual_account_id; expected $AWS_ACCOUNT_ID." >&2
            exit 1
          }
          aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER_NAME" \
            --query 'clusters[?status==`ACTIVE`].clusterName | [0]' \
            --output text | grep -Fx "$ECS_CLUSTER_NAME" >/dev/null

      - name: Register migration task definition
        id: migration-definition
        shell: bash
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_MIGRATION_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > migration-current.json

          matching_containers="$(jq --arg container "$ECS_MIGRATION_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $container)] | length' \
            migration-current.json)"
          test "$matching_containers" = "1" || {
            echo "Expected exactly one migration container named $ECS_MIGRATION_CONTAINER_NAME." >&2
            exit 1
          }

          jq \
            --arg container "$ECS_MIGRATION_CONTAINER_NAME" \
            --arg image "$ECR_REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG" '
              del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
              | (.containerDefinitions[] | select(.name == $container).image) = $image
            ' migration-current.json > migration-next.json

          migration_task_definition="$(aws ecs register-task-definition \
            --cli-input-json file://migration-next.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          echo "arn=$migration_task_definition" >> "$GITHUB_OUTPUT"

      - name: Run migrations and seed launch sources
        shell: bash
        env:
          MIGRATION_TASK_DEFINITION: ${{ steps.migration-definition.outputs.arn }}
        run: |
          bash .github/scripts/run-one-shot-ecs-task.sh alembic upgrade head
          bash .github/scripts/run-one-shot-ecs-task.sh \
            python alembic/seeds/seed_launch_sources.py

      - name: Register task definitions and start rolling deployments
        shell: bash
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          : > rollback-task-definitions.tsv
          : > deployed-services.txt
          : > deployed-task-definitions.tsv

          while IFS= read -r deployment; do
            service="$(jq -r '.service' <<<"$deployment")"
            container="$(jq -r '.container' <<<"$deployment")"
            image_type="$(jq -r '.image' <<<"$deployment")"
            case "$image_type" in
              api) repository="$ECR_API_REPOSITORY" ;;
              worker) repository="$ECR_WORKER_REPOSITORY" ;;
              frontend) repository="$ECR_FRONTEND_REPOSITORY" ;;
              *) echo "Unsupported image type: $image_type" >&2; exit 1 ;;
            esac
            image_uri="$ECR_REGISTRY/$repository:$IMAGE_TAG"

            aws ecs describe-services \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "$service" > service-current.json
            failure_reason="$(jq -r '.failures[0].reason // empty' service-current.json)"
            test -z "$failure_reason" || {
              echo "ECS service $service is unavailable: $failure_reason" >&2
              exit 1
            }
            current_task_definition="$(jq -r '.services[0].taskDefinition // empty' service-current.json)"
            test -n "$current_task_definition" || {
              echo "ECS service $service has no task definition." >&2
              exit 1
            }

            aws ecs describe-task-definition \
              --task-definition "$current_task_definition" \
              --query taskDefinition \
              --output json > task-definition-current.json
            matching_containers="$(jq --arg container "$container" \
              '[.containerDefinitions[] | select(.name == $container)] | length' \
              task-definition-current.json)"
            test "$matching_containers" = "1" || {
              echo "Expected exactly one container named $container in $current_task_definition." >&2
              exit 1
            }

            jq --arg container "$container" --arg image "$image_uri" '
              del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
              | (.containerDefinitions[] | select(.name == $container).image) = $image
            ' task-definition-current.json > task-definition-next.json
            next_task_definition="$(aws ecs register-task-definition \
              --cli-input-json file://task-definition-next.json \
              --query taskDefinition.taskDefinitionArn \
              --output text)"

            printf '%s\t%s\n' "$service" "$current_task_definition" >> rollback-task-definitions.tsv
            printf '%s\n' "$service" >> deployed-services.txt
            printf '%s\t%s\n' "$service" "$next_task_definition" >> deployed-task-definitions.tsv
            aws ecs update-service \
              --cluster "$ECS_CLUSTER_NAME" \
              --service "$service" \
              --task-definition "$next_task_definition" \
              --deployment-configuration 'minimumHealthyPercent=50,maximumPercent=200,deploymentCircuitBreaker={enable=true,rollback=true}' \
              >/dev/null
          done < <(jq -c '.[]' <<<"$ECS_SERVICE_DEPLOYMENTS")

      - name: Wait for all services to become stable
        shell: bash
        run: |
          mapfile -t services < deployed-services.txt
          test "${#services[@]}" -gt 0
          for ((offset = 0; offset < ${#services[@]}; offset += 10)); do
            batch=("${services[@]:offset:10}")
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "${batch[@]}"
          done

          while IFS=$'\t' read -r service expected_task_definition; do
            revision_completed=false
            for attempt in {1..30}; do
              service_state="$(aws ecs describe-services \
                --cluster "$ECS_CLUSTER_NAME" \
                --services "$service" \
                --output json)"
              actual_task_definition="$(jq -r '.services[0].taskDefinition // empty' <<<"$service_state")"
              test "$actual_task_definition" = "$expected_task_definition" || {
                echo "ECS service $service stabilized on $actual_task_definition instead of deployed revision $expected_task_definition." >&2
                exit 1
              }
              rollout_state="$(jq -r --arg expected "$expected_task_definition" \
                '.services[0].deployments[] | select(.taskDefinition == $expected) | .rolloutState // empty' \
                <<<"$service_state")"
              if [ "$rollout_state" = "COMPLETED" ]; then
                revision_completed=true
                break
              fi
              sleep 10
            done
            test "$revision_completed" = true || {
              echo "ECS service $service revision $expected_task_definition did not complete (last state: $rollout_state)." >&2
              exit 1
            }
          done < deployed-task-definitions.tsv

      - name: Smoke test deployed API
        shell: bash
        run: |
          api_base_url="${API_BASE_URL%/}"
          curl --fail --silent --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            "$api_base_url/health/ready" > health-response.json
          jq -e '.status == "ready"' health-response.json >/dev/null

          if [ -n "$AUTH_SMOKE_TEST_PATH" ]; then
            auth_status="$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$api_base_url/${AUTH_SMOKE_TEST_PATH#/}")"
            test "$auth_status" = "401" || {
              echo "Unauthenticated smoke request returned $auth_status; expected 401." >&2
              exit 1
            }
          else
            echo "AUTH_SMOKE_TEST_PATH is not configured; protected-route smoke test is deferred."
          fi

      - name: Roll back services after deployment failure
        if: failure()
        shell: bash
        run: |
          if [ ! -s rollback-task-definitions.tsv ]; then
            echo "No ECS service updates were started; rollback is not required."
            exit 0
          fi

          rollback_services=()
          while IFS=$'\t' read -r service task_definition; do
            rollback_services+=("$service")
            aws ecs update-service \
              --cluster "$ECS_CLUSTER_NAME" \
              --service "$service" \
              --task-definition "$task_definition" \
              --force-new-deployment \
              >/dev/null
          done < rollback-task-definitions.tsv

          for ((offset = 0; offset < ${#rollback_services[@]}; offset += 10)); do
            batch=("${rollback_services[@]:offset:10}")
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "${batch[@]}"
          done
